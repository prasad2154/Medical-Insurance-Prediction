[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-insurance-predictor"
version = "1.0.0"
description = "Medical Insurance Cost Prediction Web Application using ML & Streamlit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "plotly>=5.18.0",
    "joblib>=1.3.0",
]
